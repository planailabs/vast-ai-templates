stages:
  - cache
  - build
  - deploy

variables:
  XZAR_SERVER: "https://xzar.plan.ai"

# The runner image (packages.ci-image) already lists xzar.plan.ai as a
# substituter, so pinning the devshell here is what makes the build and deploy
# jobs pull it instead of rebuilding skopeo & co on every pipeline.
cache-devshell:
  stage: cache
  tags:
    - nix-image
  script:
    - nix develop --profile .ci-devshell -c true
    - xzar --server "$XZAR_SERVER" --key "$XZAR_TOKEN" upload --pin "vast-ai-templates-devshell" --expires 30d .ci-devshell
  rules:
    - if: $XZAR_TOKEN
  timeout: 1h

build:
  stage: build
  tags:
    - nix-image
  parallel:
    matrix:
      # Keep in sync with cudaVersions in flake.nix.
      - CUDA: [cuda12, cuda13, cuda12_6, cuda12_8, cuda12_9, cuda13_0, cuda13_1, cuda13_2, cuda13_3]
  script:
    # Only the system closure — pinning the packed image would store the same
    # bytes a second time. deploy repacks the tarball from this closure.
    - nix build ".#$CUDA-toplevel" -L
    - if [ -n "$XZAR_TOKEN" ]; then xzar --server "$XZAR_SERVER" --key "$XZAR_TOKEN" upload --pin "vast-ai-templates-$CUDA" --expires 30d ./result; fi
  timeout: 3h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  parallel:
    matrix:
      # Keep in sync with cudaVersions in flake.nix.
      - CUDA: [cuda12, cuda13, cuda12_6, cuda12_8, cuda12_9, cuda13_0, cuda13_1, cuda13_2, cuda13_3]
  script:
    - nix develop -c bash push-image.sh "$CUDA"
  timeout: 3h
  environment: production
  resource_group: production
